name: Build GTAiOS IPA (Own UI + Engine)
on:
  push:
    branches: [ios-usb-port]
    paths: ['native/**', 'ios/Sources/UI/**', 'ios/Sources/Resources/**', 'ios/Sources/Engine/EngineOptions.swift', '.gitmodules', '.github/workflows/build-native-engine-ipa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gta-native-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-engine:
    # xcode-27 is GitHub's macOS 27 Apple Silicon runner image.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Bundle GTAiOS developer GitHub profile image
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 35 \
            'https://avatars.githubusercontent.com/u/214680657?s=256&v=4' \
            -o "$RUNNER_TEMP/gtaios-github-avatar"
          sips -s format png "$RUNNER_TEMP/gtaios-github-avatar" \
            --out ios/Sources/Resources/gtaios-developer-avatar.png >/dev/null
          test -s ios/Sources/Resources/gtaios-developer-avatar.png
      - name: Fetch exact private engine input with read-only deploy key
        uses: actions/checkout@v4
        with:
          repository: NightVibes33/playgta5-engine-input
          ref: bd66a8262ecbc19aaa7bedcc11432332ba1301e1
          ssh-key: ${{ secrets.MUGUET_ENGINE_DEPLOY_KEY }}
          path: .engine-input
          persist-credentials: false
      - name: Verify source engine and apply external-folder adapter
        run: |
          set -euo pipefail
          echo '11ca8d2c04c5e843d18ff4aea4899d72c86973c6b031df334e67c446b2ae83e0  .engine-input/game.wasm' | shasum -a 256 -c -
          python3 native/prepare_muguet.py
          python3 native/patch_winit_scene.py
          plutil -lint native/Muguet/ios/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName' native/Muguet/ios/Info.plist | grep -Fxq GTAIOSSceneDelegate
          grep -Fq 'initWithWindowScene:' native/Muguet/vendor/winit/src/platform_impl/ios/window.rs
          grep -Fq 'winit = { path = "vendor/winit" }' native/Muguet/Cargo.toml
          grep -Fq 'GTAiOS Developer' native/Muguet/ios/GTAFiveTabLauncher.swift
          if grep -Fq 'Engine & Acknowledgements' native/Muguet/ios/GTAFiveTabLauncher.swift; then
            echo 'Unexpected upstream credits section in user interface' >&2
            exit 1
          fi
          grep -Fq 'NightVibes33-github-avatar' native/Muguet/ios/GTAFiveTabLauncher.swift
          grep -Fq 'https://github.com/NightVibes33' native/Muguet/ios/GTAFiveTabLauncher.swift
          grep -Fq 'GTAFiveTabController()' native/Muguet/ios/Launcher.swift
          grep -Fq '@objc(GTAIOSSceneDelegate)' native/Muguet/ios/Launcher.swift
          grep -Fq 'gtaios_active_window_scene' native/Muguet/ios/Launcher.swift
          grep -Fq 'TouchControlsOverlay' native/Muguet/ios/SteamIOSControllerOverlay.swift
          grep -Fq 'private static func defaultLayout()' native/Muguet/ios/SteamIOSControllerOverlay.swift
          grep -Fq 'struct TouchControlButton: View' native/Muguet/ios/SteamIOSControllerOverlay.swift
          ! grep -Fq 'ControlLayoutMenu' native/Muguet/ios/SteamIOSControllerOverlay.swift
          ! grep -Fq 'padTint' native/Muguet/ios/SteamIOSControllerOverlay.swift
          grep -Fq 'SteamIOSGamepadInput.shared.reserveSessionSlot()' native/Muguet/ios/Launcher.swift
          grep -Fq 'input::set_focus(true);' native/Muguet/src/pad.rs
          grep -Fq 'if held(0x4000) { keys.insert("Space"); }' native/Muguet/src/pad.rs
          grep -Fq 'if pad.rt > 51 { *buttons |= 1; }' native/Muguet/src/pad.rs
          grep -Fq 'input::native_stick_gain()' native/Muguet/src/pad.rs
          grep -Fq 'muguet_steamios_set_mouse_sensitivity' native/Muguet/src/input.rs
          grep -Fq 'muguet_steamios_set_stick_gain' native/Muguet/src/input.rs
          grep -Fq 'GTAIOSLandscape.enforce' native/Muguet/ios/Launcher.swift
          grep -Fq 'provider_backed && e.raw_os_error() == Some(2)' native/Muguet/src/io.rs
          grep -Fq 'self.shader_dir.to_string_lossy().contains("/Library/LiveFiles/")' native/Muguet/src/gpu.rs
          grep -Fq 'NSFileCoordinator(filePresenter: nil)' native/Muguet/ios/Launcher.swift
          grep -Fq 'NSFileProviderErrorDomain' native/Muguet/ios/Launcher.swift
          grep -Fq 'verifyReadyForPlay' native/Muguet/ios/GTAFiveTabLauncher.swift
          grep -Fq 'Reconnect GTA V Drive' native/Muguet/ios/GTAFiveTabLauncher.swift
          grep -Fq 'startAccessingSecurityScopedResource()' native/Muguet/ios/Launcher.swift
          grep -Fq 'supportedInterfaceOrientations: UIInterfaceOrientationMask { .portrait }' native/Muguet/ios/GTAFiveTabLauncher.swift
          grep -Fq 'ValidOrientations::Portrait' native/Muguet/src/app.rs
          grep -Fq 'ValidOrientations::Landscape' native/Muguet/src/app.rs
          ! grep -Fq 'GTAReference.image(' native/Muguet/ios/GTAFiveTabLauncher.swift
          grep -Fq 'muguet_steamios_text' native/Muguet/src/pad.rs
          grep -Fq 'steamios_text(character' native/Muguet/src/input.rs
          grep -Fq 'steamios_apply_touch(steamios' native/Muguet/src/pad.rs
          grep -Fq 'steamios_overlay_active()' native/Muguet/src/app.rs
          grep -Fq 'input::set_focus(true);' native/Muguet/src/pad.rs
          grep -Fq 'UIInterfaceOrientationPortrait' native/Muguet/ios/Info.plist
          grep -Fq 'UIInterfaceOrientationLandscapeRight' native/Muguet/ios/Info.plist
          grep -Fq 'muguet_steamios_pad_update' native/Muguet/src/pad.rs
          grep -Fq 'muguet_steamios_swipe_look' native/Muguet/src/pad.rs
          grep -Fq 'GTAIOSSwipeLookGesture' native/Muguet/ios/SteamIOSControllerOverlay.swift
          grep -Fq 'Swipe to look (optional)' native/Muguet/ios/Launcher.swift
          ! grep -Fq 'crate::touch::install(&window)' native/Muguet/src/app.rs
          test "$(sw_vers -productVersion | cut -d. -f1)" = 27
          xcodebuild -version
          xcodebuild -version > "$RUNNER_TEMP/xcode-version.txt"
          cat "$RUNNER_TEMP/xcode-version.txt"
          grep -Eq 'Xcode 27(\.|$)' "$RUNNER_TEMP/xcode-version.txt"
      - name: Typecheck SteamIOS controller and GTA V iOS UI before native engine build
        run: |
          set -euo pipefail
          cd native/Muguet
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc -parse-as-library -typecheck \
            -target arm64-apple-ios18.0 -sdk "$SDK" \
            -module-name GTAiOSFrontend \
            ios/Launcher.swift ios/GTAFiveTabLauncher.swift \
            ios/EngineOptions.swift ios/GTALaunchPreferences.swift \
            ios/LogStore.swift ios/SteamIOSControllerOverlay.swift
      - name: Install pinned Rust and XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/Muguet/target/release
            native/Muguet/target/ios
          key: muguet-ios-${{ runner.arch }}-rust1981-${{ hashFiles('native/Muguet/Cargo.lock', 'native/prepare_muguet.py', 'native/ExternalImporter.swift') }}
          restore-keys: muguet-ios-${{ runner.arch }}-rust1981-
      - name: Compile real engine and native Metal runtime
        env:
          BUNDLE_ID: com.nightvibes33.gtaios
          MUGUET_IOS_HEAP_GB: '5'
        run: |
          set -euo pipefail
          cd native/Muguet
          ./make-ios.sh "$GITHUB_WORKSPACE/.engine-input/game.wasm" --ipa 2>&1 | tee "$RUNNER_TEMP/native-engine-build.log"
      - name: Verify signed code and external-only game assets
        run: |
          set -euo pipefail
          # Rename the final signed app container, not the pinned engine executable.
          # The installed app and the downloadable artifact both belong to GTAiOS.
          STAGE="$RUNNER_TEMP/gtaios-ipa"
          mkdir -p "$STAGE"
          unzip -q native/Muguet/build/Muguet.ipa -d "$STAGE"
          test -d "$STAGE/Payload/Muguet.app"
          mv "$STAGE/Payload/Muguet.app" "$STAGE/Payload/GTAiOS.app"
          APP="$STAGE/Payload/GTAiOS.app"
          echo "::group::Inspect built native GTAiOS app"
          ls -lah "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
          echo "::endgroup::"
          # Source license is shipped with the IPA but never added to developer credits.
          # XcodeGen may skip extensionless LICENSE when it is listed as a source.
          if [ ! -s "$APP/LICENSE" ]; then
            cp native/Muguet/LICENSE "$APP/LICENSE"
            codesign --force --sign - \
              --entitlements native/Muguet/ios/Muguet-sideload.entitlements \
              --generate-entitlement-der "$APP"
          fi
          codesign --verify --verbose=2 "$APP"
          test -s "$APP/LICENSE" || { echo "ERROR: upstream license missing from packaged IPA"; exit 1; }
          test -s "$APP/muguet" || { echo "ERROR: compiled executable missing"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fxq com.nightvibes33.gtaios
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP/Info.plist" | grep -Fxq GTAiOS
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" | grep -Fxq 'GTA V iOS'
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName' "$APP/Info.plist" | grep -Fxq GTAIOSSceneDelegate
          strings "$APP/muguet" > "$RUNNER_TEMP/gtaios-app-symbols.txt"
          grep -Fq GTAIOSSceneDelegate "$RUNNER_TEMP/gtaios-app-symbols.txt"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" | grep -Fxq '18.0'
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations' "$APP/Info.plist" | grep -Fq Portrait
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations' "$APP/Info.plist" | grep -Fq LandscapeRight
          (cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/GTAiOS.ipa" Payload)
          python3 native/verify_external_assets.py --ipa GTAiOS.ipa
          xcrun otool -l "$STAGE/Payload/GTAiOS.app/muguet" > "$RUNNER_TEMP/native-engine-mach-o.txt"
          grep -q '__GAME' "$RUNNER_TEMP/native-engine-mach-o.txt"
          shasum -a 256 GTAiOS.ipa > "$RUNNER_TEMP/GTAiOS.sha256"
      - name: Upload native engine IPA
        uses: actions/upload-artifact@v4
        with:
          name: GTAiOS-IPA
          path: GTAiOS.ipa
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTAiOS-Native-build-diagnostics
          path: |
            ${{ runner.temp }}/native-engine-build.log
            ${{ runner.temp }}/native-engine-mach-o.txt
          if-no-files-found: ignore
